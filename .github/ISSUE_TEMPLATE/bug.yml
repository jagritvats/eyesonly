name: Bug report
description: Something doesn't work as documented (not a security issue)
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Commands, ideally a short script. Redact tokens and secrets.
      render: bash
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: "`eyesonly --version` (or commit), `node --version`, `git --version`, OS"
    validations:
      required: true

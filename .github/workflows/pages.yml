# Deploys the landing page (site/ + assets/) and the guides (docs/*.md) to GitHub Pages.
name: pages
on:
  push:
    branches: [main]
    paths: ['site/**', 'assets/**', 'docs/**', 'scripts/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Assemble site
        run: |
          mkdir -p _site/assets
          cp -r site/. _site/
          cp assets/*.png assets/*.gif _site/assets/
      - name: Build guides
        run: node scripts/build-docs.mjs _site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4

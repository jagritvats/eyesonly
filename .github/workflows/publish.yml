# Publishes to npm when a v* tag is pushed, using npm trusted publishing (OIDC),
# so every release carries provenance. One-time setup: publish the first version by
# hand, then add this repo + workflow as a trusted publisher on npmjs.com.
name: publish
on:
  push:
    tags: ['v*']
permissions:
  contents: write   # create the GitHub release
  id-token: write   # npm trusted publishing / provenance
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      COMMITTER_TOKEN: ${{ secrets.COMMITTER_TOKEN }}   # PAT that can push to jagritvats/homebrew-tap
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm i -g npm@latest
      - run: npm test
      - name: Check tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - name: Publish (skipped if this version is already on npm, e.g. a manual first publish)
        run: |
          if npm view "eyesonly@$(node -p 'require("./package.json").version')" version >/dev/null 2>&1; then
            echo "already published; skipping"
          else
            npm publish --access public
          fi
      - run: gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Bump the Homebrew formula (skipped until COMMITTER_TOKEN is set)
        if: env.COMMITTER_TOKEN != ''
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - if: env.COMMITTER_TOKEN != ''
        uses: mislav/bump-homebrew-formula-action@v4
        with:
          formula-name: eyesonly
          homebrew-tap: jagritvats/homebrew-tap
          download-url: https://registry.npmjs.org/eyesonly/-/eyesonly-${{ env.VERSION }}.tgz
